name: Build WTDT APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wtdt-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --clean

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --console=plain

      - name: Rename APK
        shell: bash
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          SHORT_SHA="${GITHUB_SHA::7}"
          APK_NAME="WTDT-Spark-Calendar-v${VERSION}-build${GITHUB_RUN_NUMBER}-${SHORT_SHA}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WTDT-APK-v${{ env.VERSION }}-build${{ github.run_number }}
          path: ${{ env.APK_NAME }}
          retention-days: 90
          if-no-files-found: error
          compression-level: 0

      - name: Build summary
        run: |
          echo "## WTDT 星火日曆 APK" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "APK 已放在本次 Workflow 的 **Artifacts**。" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact：WTDT-APK-v${VERSION}-build${GITHUB_RUN_NUMBER}" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK：${APK_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit：${SHORT_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 保存期限：90 天" >> "$GITHUB_STEP_SUMMARY"
