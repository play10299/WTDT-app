name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Generate Android native project
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/WTDT-Spark-Calendar-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WTDT-Spark-Calendar-APK
          path: dist/WTDT-Spark-Calendar-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        run: |
          echo "## WTDT 星火日曆 Android 測試版" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "APK 已建立完成，可從本次 Actions 的 Artifacts 下載 **WTDT-Spark-Calendar-APK**。" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 類型：Debug APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit：\`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 安裝：Android 允許安裝未知來源後，可直接安裝 APK 測試。" >> "$GITHUB_STEP_SUMMARY"
