name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

# APK builds are expensive. If a newer commit arrives while an older APK is
# still compiling, cancel the obsolete build instead of queueing/running both.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java 17 + Gradle cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Type check
        run: npm run typecheck

      - name: Generate Android native project
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Build debug APK
        working-directory: android
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.jvmargs=-Xmx4g
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --parallel --build-cache --console=plain

      - name: Prepare versioned APK
        shell: bash
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          SHORT_SHA="${GITHUB_SHA::7}"
          ARTIFACT_NAME="WTDT-Spark-Calendar-v${VERSION}-build${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          APK_NAME="${ARTIFACT_NAME}.apk"
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/${APK_NAME}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> "$GITHUB_ENV"
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"

      - name: Upload versioned APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Build summary
        run: |
          echo "## WTDT 星火日曆 Android 測試版" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "本次 APK 已獨立保存到 Actions Artifacts。" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 版本：v${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build：#${GITHUB_RUN_NUMBER}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit：\`${SHORT_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact：\`${ARTIFACT_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK：\`${APK_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 保存期限：90 天" >> "$GITHUB_STEP_SUMMARY"
          echo "- 安裝：Android 允許安裝未知來源後，可直接安裝 APK 測試。" >> "$GITHUB_STEP_SUMMARY"
