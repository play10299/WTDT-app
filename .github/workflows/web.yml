name: Build WTDT Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wtdt-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Export web app
        run: npm run web:build
      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: WTDT-Web-build${{ github.run_number }}
          path: dist
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
      - name: Summary
        run: |
          echo "## WTDT 星火日曆 Web" >> "$GITHUB_STEP_SUMMARY"
          echo "網頁版已輸出到本次 Workflow 的 Artifacts。" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact：WTDT-Web-build${GITHUB_RUN_NUMBER}" >> "$GITHUB_STEP_SUMMARY"
