name: Update History

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record-update:
    name: Record update and verify project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Record update details
        shell: bash
        run: |
          echo "## WDTD 星火日曆｜更新紀錄" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 事件：${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 分支：${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit：\`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 作者：${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 執行編號：#${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Commit 訊息" >> "$GITHUB_STEP_SUMMARY"
          git log -1 --pretty=format:'%s' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 本次變更檔案" >> "$GITHUB_STEP_SUMMARY"
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --name-status HEAD^ HEAD | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          else
            git show --pretty='' --name-status HEAD | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          fi
